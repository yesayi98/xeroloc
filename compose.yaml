services:
  app:
    build:
      context: .
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: "${APP_SECRET:-change-me-in-local-dev}"
      COMPOSER_HOME: /tmp/composer
      HOME: /tmp
      DATABASE_PATH: /app/var/data/xero_mock.sqlite
      XERO_MOCK_TENANT_ID: "${XERO_MOCK_TENANT_ID:-mock-tenant-0001}"
    volumes:
      - .:/app
      - ./identifier.sqlite:/app/var/data/xero_mock.sqlite
    command: sh -lc "mkdir -p var/data var/cache /tmp/composer && composer install --no-interaction && php -S 0.0.0.0:8000 -t public public/index.php"
